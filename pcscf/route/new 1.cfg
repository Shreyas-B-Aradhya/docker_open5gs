route[REGISTER] {
    if ($sht(a=>$ci::start_time) == $null || $sht(a=>$ci::start_time) == 0) {
        $sht(a=>$ci::start_time) = $TV(Sn);
    }

    # Log key headers
    xnotice("PCSCF REGISTER: From $fu, Contact: $ct, Source: $si:$sp");

    # Normalize R-URI
    $ru = $(ru{re.subst,/;transport=[A-Za-z]*//g});

    # Prevent routing loops
    if ($hdr(X-Kamailio-Visited) =~ "$var(NIB_ID)") {
        xlog("L_WARN", "Loop detected at $var(NIB_ID), dropping REGISTER\n");
        drop;
    }

    # Store locally
    if (is_present_hf("Contact")) {
        if (!pcscf_save_pending("location")) {
            xlog("L_WARN", "UE not found locally — forwarding REGISTER to peer P-CSCF\n");

            # Mark this node as visited
            append_hf("X-Kamailio-Visited: $var(NIB_ID)\r\n");

            # Forward to next-hop P-CSCF using dispatcher
            ds_select_dst("1", "4");  # group 1 = your P-CSCFs
            forward();
            exit;
        }
    } else {
        send_reply("403", "Missing Contact header");
        exit;
    }

    # Optional: N5 or Rx logic here...
    route(REGISTER_CONTINUE);
    exit;
}
